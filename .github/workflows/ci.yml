name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, testes unitários e e2e, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_solicitacoes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: portal
      DATABASE_PASSWORD: portal
      DATABASE_NAME_TEST: portal_solicitacoes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Testes unitários
        run: npm test
      - name: Testes end-to-end (PostgreSQL real) com cobertura
        run: npm run test:e2e:cov
      - run: npm run build

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imagens Docker + smoke test do Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack completa
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verifica saúde e login pelo proxy do frontend
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"usuario":"joana.pereira","senha":"Demo@123"}' \
            http://localhost:8080/api/auth/login
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  publicar:
    name: Publica imagens no GHCR (CD)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normaliza o nome do repositório
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-backend:latest
            ghcr.io/${{ env.REPO }}-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-frontend:latest
            ghcr.io/${{ env.REPO }}-frontend:${{ github.sha }}
